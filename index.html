<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MTG Life Counter</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 0. INTRO / SPLASH SCREEN ANIMACE */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0a0a0c;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            cursor: pointer;
        }

        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .wave-text {
            display: flex;
            gap: 2px;
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .wave-text span {
            display: inline-block;
            opacity: 0;
            transform: translateY(40px) scale(0.8);
            animation: waveIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6), 0 0 30px rgba(211, 32, 42, 0.8);
        }

        .wave-text span:nth-child(1) { animation-delay: 0.1s; }
        .wave-text span:nth-child(2) { animation-delay: 0.2s; }
        .wave-text span:nth-child(3) { animation-delay: 0.3s; }
        .wave-text span:nth-child(4) { animation-delay: 0.4s; }
        .wave-text span:nth-child(5) { animation-delay: 0.5s; }
        .wave-text span:nth-child(6) { animation-delay: 0.6s; }
        .wave-text span:nth-child(7) { animation-delay: 0.7s; }

        @keyframes waveIn {
            0% { opacity: 0; transform: translateY(40px) scale(0.8); }
            60% { transform: translateY(-10px) scale(1.1); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card-fan {
            position: relative;
            width: 120px;
            height: 90px;
        }

        .card {
            position: absolute;
            width: 50px;
            height: 75px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.7);
            background: linear-gradient(135deg, #2a2a2a, #111111);
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            left: 35px;
            top: 0;
            transform-origin: bottom center;
            opacity: 0;
            animation: fanOut 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-delay: 0.8s;
        }

        .card-1 { background: linear-gradient(135deg, #d3202a, #5a0000); }
        .card-2 { background: linear-gradient(135deg, #0e68ab, #002b52); }
        .card-3 { background: linear-gradient(135deg, #00733e, #003312); }

        @keyframes fanOut {
            0% { opacity: 0; transform: scale(0.5) rotate(0deg); }
            100% { opacity: 1; }
        }

        #splash-screen:not(.fade-out) .card-1 { transform: rotate(-25deg) translateX(-25px); }
        #splash-screen:not(.fade-out) .card-2 { transform: rotate(0deg) translateY(-8px); }
        #splash-screen:not(.fade-out) .card-3 { transform: rotate(25deg) translateX(25px); }

        /* SEKCE OBRAZOVEK */
        .screen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            padding: 20px;
            text-align: center;
            overflow-y: auto;
            position: relative;
        }

        .screen.active { display: flex; }

        /* TLAČÍTKO ZPĚT */
        .back-btn-container {
            position: absolute;
            top: max(16px, env(safe-area-inset-top));
            left: max(16px, env(safe-area-inset-left));
            z-index: 20;
        }

        .back-btn {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .back-btn:active {
            background: #444;
        }

        h1 { font-size: 1.8rem; margin-bottom: 25px; color: #e0e0e0; }
        h2 { font-size: 1.1rem; margin-bottom: 10px; color: #aaa; }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
        }

        .menu-btn {
            background: #2a2a2a;
            color: #fff;
            border: 2px solid #444;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .menu-btn:active {
            background: #444;
            transform: scale(0.98);
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 320px;
            margin-top: 10px;
        }

        .color-btn {
            aspect-ratio: 1;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
        }

        .color-btn.selected {
            border-color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        /* MTG Barvy Many */
        .bg-white { background-color: #f8f6d8; color: #111; }
        .bg-blue  { background-color: #0e68ab; color: #fff; }
        .bg-black { background-color: #211e1f; color: #fff; }
        .bg-red   { background-color: #d3202a; color: #fff; }
        .bg-green { background-color: #00733e; color: #fff; }

        /* PRVKY NASTAVENÍ ROZVRŽENÍ STOLU */
        .preview-container {
            width: 260px;
            height: 180px;
            border: 2px dashed #444;
            border-radius: 16px;
            padding: 6px;
            background: #08080a;
            margin-bottom: 10px;
            touch-action: none;
        }

        .table-preview {
            width: 100%;
            height: 100%;
            display: grid;
            gap: 4px;
        }

        .table-preview.players-2 { grid-template-rows: 1fr 1fr; grid-template-columns: 1fr; }
        .table-preview.players-4 { grid-template-rows: 1fr 1fr; grid-template-columns: 1fr 1fr; }
        
        .table-preview.players-3-bottom-span { grid-template-rows: 1fr 1fr; grid-template-columns: 1fr 1fr; }
        .table-preview.players-3-bottom-span .slot:nth-child(3) { grid-column: span 2; }
        
        .table-preview.players-3-top-span { grid-template-rows: 1fr 1fr; grid-template-columns: 1fr 1fr; }
        .table-preview.players-3-top-span .slot:nth-child(1) { grid-column: span 2; }

        .slot {
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            border: 2px solid transparent;
            position: relative;
            transition: transform 0.15s ease, border-color 0.2s;
        }

        .slot.active-slot {
            border-color: #ffffff;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
            z-index: 2;
        }

        .slot.dragging {
            opacity: 0.6;
            transform: scale(0.9);
        }

        .slot.drag-over {
            border-color: #4eff81;
            box-shadow: inset 0 0 0 3px #4eff81;
        }

        .slot-rotate {
            display: inline-block;
            transform: rotate(180deg);
        }

        .layout-options {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .opt-btn {
            background: #222;
            color: #aaa;
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .opt-btn.active {
            background: #444;
            color: #fff;
            border-color: #888;
            font-weight: bold;
        }

        .controls-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
            justify-content: center;
        }

        .sub-btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.1s;
        }

        .sub-btn:active {
            background: #555;
        }

        /* 3D KOSTKY & MODALY STYLY */
        .dice-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(10, 10, 12, 0.92);
            backdrop-filter: blur(10px);
            z-index: 300;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .dice-modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .dice-scene {
            width: 260px;
            height: 140px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            perspective: 800px;
        }

        .cube-container {
            width: 60px;
            height: 60px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.8s cubic-bezier(0.2, 0.8, 0.25, 1);
        }

        .cube-face {
            position: absolute;
            width: 60px;
            height: 60px;
            background: #ffffff;
            border: 2px solid #ccc;
            border-radius: 10px;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.2), 0 4px 10px rgba(0,0,0,0.5);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 5px;
            box-sizing: border-box;
        }

        .dot {
            background-color: #1a1a1a;
            border-radius: 50%;
            align-self: center;
            justify-self: center;
            width: 10px;
            height: 10px;
            display: none;
        }

        .face-1 { transform: rotateY(0deg) translateZ(30px); }
        .face-2 { transform: rotateY(180deg) translateZ(30px); }
        .face-3 { transform: rotateY(-90deg) translateZ(30px); }
        .face-4 { transform: rotateY(90deg) translateZ(30px); }
        .face-5 { transform: rotateX(-90deg) translateZ(30px); }
        .face-6 { transform: rotateX(90deg) translateZ(30px); }

        .pos-tl { grid-area: 1 / 1; }
        .pos-tr { grid-area: 1 / 3; }
        .pos-ml { grid-area: 2 / 1; }
        .pos-c  { grid-area: 2 / 2; }
        .pos-mr { grid-area: 2 / 3; }
        .pos-bl { grid-area: 3 / 1; }
        .pos-br { grid-area: 3 / 3; }

        .face-1 .pos-c { display: block; background-color: #d3202a; }
        .face-2 .pos-tl, .face-2 .pos-br { display: block; }
        .face-3 .pos-tl, .face-3 .pos-c, .face-3 .pos-br { display: block; }
        .face-4 .pos-tl, .face-4 .pos-tr, .face-4 .pos-bl, .face-4 .pos-br { display: block; }
        .face-5 .pos-tl, .face-5 .pos-tr, .face-5 .pos-c, .face-5 .pos-bl, .face-5 .pos-br { display: block; }
        .face-6 .pos-tl, .face-6 .pos-tr, .face-6 .pos-ml, .face-6 .pos-mr, .face-6 .pos-bl, .face-6 .pos-br { display: block; }

        .dice-result-text {
            font-size: 1.5rem;
            font-weight: 800;
            margin-top: 25px;
            min-height: 55px;
            color: #ffffff;
            text-align: center;
            padding: 0 20px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        @keyframes diceBounce {
            0% { transform: translateY(-120px) scale(0.6); }
            50% { transform: translateY(0px) scale(1.1); }
            70% { transform: translateY(-25px) scale(0.95); }
            100% { transform: translateY(0px) scale(1); }
        }

        .dice-bounce-wrapper {
            display: flex;
            gap: 40px;
        }

        .dice-bounce-wrapper.animating {
            animation: diceBounce 1.2s cubic-bezier(0.28, 0.84, 0.42, 1);
        }

        /* COMMANDER DAMAGE TABULKA / MODAL BOX S MOŽNOSTÍ OTOČENÍ */
        .cmd-modal-box {
            width: 90%;
            max-width: 340px;
            background: #16161a;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            transition: transform 0.2s ease;
        }

        .cmd-modal-box.rotated {
            transform: rotate(180deg);
        }

        /* HERNÍ OBRAZOVKA */
        #game-screen {
            position: relative;
            height: 100vh;
            width: 100vw;
            padding: 0;
            touch-action: none;
            overflow: hidden;
        }

        /* HERNÍ NOTIFIKAČNÍ HLÁŠKA NAD TABULKOU */
        .game-notification {
            position: absolute;
            top: max(20px, env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            background: rgba(211, 32, 42, 0.96);
            color: #fff;
            padding: 10px 24px;
            border-radius: 16px;
            font-weight: 900;
            font-size: 1.05rem;
            z-index: 999;
            box-shadow: 0 8px 25px rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            pointer-events: none;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .game-notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* PLOVOUCÍ DROPDOWN MENU */
        .menu-container {
            position: absolute;
            top: max(12px, env(safe-area-inset-top));
            right: max(12px, env(safe-area-inset-right));
            z-index: 50;
        }

        .dots-btn {
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            line-height: 1;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 48px;
            right: 0;
            background: rgba(20, 20, 25, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 8px;
            flex-direction: column;
            gap: 6px;
            min-width: 130px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
        }

        .dropdown-menu.show {
            display: flex;
        }

        .dropdown-item {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
        }

        .dropdown-item:active {
            background: rgba(255, 255, 255, 0.25);
        }

        #grid {
            width: 100vw;
            height: 100vh;
            display: grid;
            gap: 2px;
            background: #000;
        }

        .players-2 { grid-template-rows: 1fr 1fr; grid-template-columns: 1fr; }
        .players-3-bottom-span { grid-template-rows: 1fr 1fr; grid-template-columns: 1fr 1fr; }
        .players-3-bottom-span .player-card:nth-child(3) { grid-column: span 2; }
        .players-3-top-span { grid-template-rows: 1fr 1fr; grid-template-columns: 1fr 1fr; }
        .players-3-top-span .player-card:nth-child(1) { grid-column: span 2; }
        .players-4 { grid-template-rows: 1fr 1fr; grid-template-columns: 1fr 1fr; }

        @media (orientation: landscape) {
            .players-2 { grid-template-rows: 1fr; grid-template-columns: 1fr 1fr; }
        }

        .player-card {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: filter 0.15s ease, box-shadow 0.15s ease;
        }

        .player-card.dragging {
            opacity: 0.8;
            z-index: 100;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
            border: 2px solid #fff;
        }

        .player-card.drag-over {
            box-shadow: inset 0 0 0 4px #ffffff;
            filter: brightness(1.2);
        }

        /* Vnitřní obsah karty, který se rotuje pro horní hráče */
        .player-content {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .player-content.rotate-content {
            transform: rotate(180deg);
        }

        /* CMD TLAČÍTKO */
        .cmd-btn {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #fff;
            padding: 5px 12px;
            border-radius: 14px;
            font-size: 0.8rem;
            font-weight: 800;
            cursor: pointer;
            margin-bottom: 8px;
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: background 0.2s, transform 0.1s;
        }

        .cmd-btn:active {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0.95);
        }

        /* Fixní dotykové zóny */
        .touch-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            display: flex;
            align-items: center;
            font-size: 2.5rem;
            font-weight: 300;
            opacity: 0.2;
            z-index: 3;
            cursor: pointer;
            touch-action: none;
        }

        .touch-left { left: 0; justify-content: flex-start; padding-left: 25px; }
        .touch-right { right: 0; justify-content: flex-end; padding-right: 25px; }

        .touch-zone:active {
            opacity: 0.5;
            background: rgba(255, 255, 255, 0.15);
        }

        .life-total {
            font-size: clamp(3.5rem, 18vmin, 7.5rem);
            font-weight: 800;
            line-height: 1;
            pointer-events: none;
            letter-spacing: -2px;
        }

        .life-change-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -110%);
            font-size: clamp(1.8rem, 8vmin, 3.2rem);
            font-weight: 900;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            text-shadow: 0 4px 12px rgba(0,0,0,0.8);
            background: rgba(0, 0, 0, 0.45);
            padding: 4px 16px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }

        .life-change-badge.show {
            opacity: 1;
            transform: translate(-50%, -130%);
        }

        .life-change-badge.plus { color: #4eff81; }
        .life-change-badge.minus { color: #ff5252; }

        .player-label {
            position: absolute;
            top: 10px;
            left: 14px;
            font-size: 0.85rem;
            font-weight: 800;
            opacity: 0.6;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- 0. ÚVODNÍ ANIMACE (SPLASH SCREEN) -->
    <div id="splash-screen" onclick="skipSplash()">
        <div class="wave-text">
            <span>A</span>
            <span>d</span>
            <span>a</span>
            <span>m</span>
            <span>o</span>
            <span>v</span>
            <span>o</span>
        </div>
        <div class="card-fan">
            <div class="card card-1"></div>
            <div class="card card-2"></div>
            <div class="card card-3"></div>
        </div>
    </div>

    <!-- 1. VÝBĚR JAZYKA -->
    <div id="screen-lang" class="screen active">
        <h1>Select Language / Výběr jazyka</h1>
        <div class="btn-group">
            <button class="menu-btn" onclick="selectLang('cs')">Čeština 🇨🇿</button>
            <button class="menu-btn" onclick="selectLang('en')">English 🇬🇧</button>
        </div>
    </div>

    <!-- 2. VÝBĚR POČÁTEČNÍCH ŽIVOTŮ -->
    <div id="screen-starting-life" class="screen">
        <div class="back-btn-container"><button class="back-btn" onclick="showScreen('screen-lang')">← <span class="txt-back">Zpět</span></button></div>
        <h1 id="txt-select-life">Počáteční životy</h1>
        <div class="btn-group">
            <button class="menu-btn" onclick="selectStartingLife(20)">STANDARD</button>
            <button class="menu-btn" onclick="selectStartingLife(40)">COMMANDER</button>
        </div>
    </div>

    <!-- 3. VÝBĚR POČTU HRÁČŮ -->
    <div id="screen-players" class="screen">
        <div class="back-btn-container"><button class="back-btn" onclick="showScreen('screen-starting-life')">← <span class="txt-back">Zpět</span></button></div>
        <h1 id="txt-select-players">Počet hráčů</h1>
        <div class="btn-group">
            <button class="menu-btn" onclick="selectPlayerCount(2)">2</button>
            <button class="menu-btn" onclick="selectPlayerCount(3)">3</button>
            <button class="menu-btn" onclick="selectPlayerCount(4)">4</button>
        </div>
    </div>

    <!-- 4. NASTAVENÍ STOLU & BAREV -->
    <div id="screen-colors" class="screen">
        <div class="back-btn-container"><button class="back-btn" onclick="showScreen('screen-players')">← <span class="txt-back">Zpět</span></button></div>
        <h1 id="txt-select-colors">Rozvržení a Barvy</h1>
        
        <!-- Přepínač rozvržení (pro 3 hráče) -->
        <div id="layout-selector-container" class="layout-options" style="display: none;"></div>

        <!-- Náhled mřížky stolu s Drag & Drop -->
        <div class="preview-container">
            <div id="table-preview" class="table-preview"></div>
        </div>

        <div class="controls-row">
            <h2 id="txt-selected-slot-info" style="margin:0;">Vybráno: P1</h2>
        </div>
        
        <div style="margin-bottom: 10px;">
            <button class="sub-btn" id="btn-roll-dice-trigger" onclick="openDiceRollModal()" style="background: #d3202a; border-color: #ff5252; padding: 10px 20px; font-size: 0.95rem;">🎲 Hodit kostkou</button>
        </div>

        <!-- Výběr barvy pro vybraný slot -->
        <div class="color-grid" id="color-options"></div>

        <div style="margin-top: 20px;">
            <button class="menu-btn" id="btn-start-game" onclick="launchGame()">Spustit hru</button>
        </div>
    </div>

    <!-- MODAL 3D KOSTKY -->
    <div id="dice-modal" class="dice-modal" onclick="closeDiceModal(event)">
        <div class="dice-scene">
            <div class="dice-bounce-wrapper" id="dice-bounce-wrapper">
                <div class="cube-container" id="cube1">
                    <div class="cube-face face-1"><div class="dot pos-c"></div></div>
                    <div class="cube-face face-2"><div class="dot pos-tl"></div><div class="dot pos-br"></div></div>
                    <div class="cube-face face-3"><div class="dot pos-tl"></div><div class="dot pos-c"></div><div class="dot pos-br"></div></div>
                    <div class="cube-face face-4"><div class="dot pos-tl"></div><div class="dot pos-tr"></div><div class="dot pos-bl"></div><div class="dot pos-br"></div></div>
                    <div class="cube-face face-5"><div class="dot pos-tl"></div><div class="dot pos-tr"></div><div class="dot pos-c"></div><div class="dot pos-bl"></div><div class="dot pos-br"></div></div>
                    <div class="cube-face face-6"><div class="dot pos-tl"></div><div class="dot pos-tr"></div><div class="dot pos-ml"></div><div class="dot pos-mr"></div><div class="dot pos-bl"></div><div class="dot pos-br"></div></div>
                </div>

                <div class="cube-container" id="cube2">
                    <div class="cube-face face-1"><div class="dot pos-c"></div></div>
                    <div class="cube-face face-2"><div class="dot pos-tl"></div><div class="dot pos-br"></div></div>
                    <div class="cube-face face-3"><div class="dot pos-tl"></div><div class="dot pos-c"></div><div class="dot pos-br"></div></div>
                    <div class="cube-face face-4"><div class="dot pos-tl"></div><div class="dot pos-tr"></div><div class="dot pos-bl"></div><div class="dot pos-br"></div></div>
                    <div class="cube-face face-5"><div class="dot pos-tl"></div><div class="dot pos-tr"></div><div class="dot pos-c"></div><div class="dot pos-bl"></div><div class="dot pos-br"></div></div>
                    <div class="cube-face face-6"><div class="dot pos-tl"></div><div class="dot pos-tr"></div><div class="dot pos-ml"></div><div class="dot pos-mr"></div><div class="dot pos-bl"></div><div class="dot pos-br"></div></div>
                </div>
            </div>
        </div>
        <div class="dice-result-text" id="dice-result-text"></div>
        <button class="sub-btn" id="dice-action-btn" onclick="executeCurrentRoll()" style="margin-top: 15px; padding: 12px 24px; font-size: 1rem; background: #2a2a2a;">🎲 Hodit za P1</button>
    </div>

    <!-- MODAL COMMANDER DAMAGE -->
    <div id="cmd-modal" class="dice-modal" onclick="closeCmdModal(event)">
        <div id="cmd-modal-box" class="cmd-modal-box">
            <h2 id="cmd-modal-title" style="color: #fff; margin-bottom: 15px; font-size: 1.2rem;">Commander Damage</h2>
            <div id="cmd-list" style="width: 100%; display: flex; flex-direction: column; gap: 10px; max-height: 50vh; overflow-y: auto; margin-bottom: 15px;"></div>
            <button class="sub-btn" onclick="closeCmdModalForce()" style="width: 100%; padding: 10px; background: #2a2a2a;">Zavřít</button>
        </div>
    </div>

    <!-- 5. HERNÍ OBRAZOVKA -->
    <div id="game-screen" class="screen">
        <!-- PLOVOUCÍ DROPDOWN MENU -->
        <div class="menu-container">
            <button class="dots-btn" onclick="toggleMenu(event)">⋮</button>
            <div class="dropdown-menu" id="dropdown-menu">
                <button class="dropdown-item" id="btn-reset" onclick="resetGame()">↺ Reset</button>
                <button class="dropdown-item" id="btn-menu" onclick="exitToMenu()">⚙️ Menu</button>
            </div>
        </div>
        
        <!-- HERNÍ MŘÍŽKA -->
        <div id="grid"></div>

        <!-- NOTIFIKACE PROHRY -->
        <div id="game-notification" class="game-notification"></div>
    </div>

    <script>
        let splashTimeout;
        let wakeLock = null;

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.warn(`Wake Lock Error: ${err.name}, ${err.message}`);
                }
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => {
                    wakeLock = null;
                });
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            splashTimeout = setTimeout(() => {
                hideSplash();
            }, 2100);
        });

        function hideSplash() {
            const splash = document.getElementById('splash-screen');
            if (splash) splash.classList.add('fade-out');
        }

        function skipSplash() {
            clearTimeout(splashTimeout);
            hideSplash();
        }

        window.addEventListener('click', (e) => {
            if (!e.target.closest('.menu-container')) {
                const menu = document.getElementById('dropdown-menu');
                if (menu) menu.classList.remove('show');
            }
        });

        function toggleMenu(e) {
            e.stopPropagation();
            const menu = document.getElementById('dropdown-menu');
            menu.classList.toggle('show');
        }

        /* LOCALIZATION STRINGS */
        const translations = {
            cs: {
                selectLife: "Počáteční počet životů",
                selectPlayers: "Zvolte počet hráčů",
                selectColors: "Rozvržení stolu & Barvy",
                start: "Spustit hru",
                reset: "Reset",
                menu: "Menu",
                selectedSlot: "Vybrán",
                rollDiceBtn: "🎲 Hodit kostkou",
                layout1Bot2Top: "1 Dole / 2 Nahoře",
                layout1Top2Bot: "1 Nahoře / 2 Dole",
                back: "Zpět"
            },
            en: {
                selectLife: "Starting Life Total",
                selectPlayers: "Select Number of Players",
                selectColors: "Table Layout & Colors",
                start: "Start Game",
                reset: "Reset",
                menu: "Menu",
                selectedSlot: "Selected",
                rollDiceBtn: "🎲 Roll Dice",
                layout1Bot2Top: "1 Bottom / 2 Top",
                layout1Top2Bot: "1 Top / 2 Bottom",
                back: "Back"
            }
        };

        const manaColors = [
            { id: 'bg-white', hex: '#f8f6d8' },
            { id: 'bg-blue',  hex: '#0e68ab' },
            { id: 'bg-black', hex: '#211e1f' },
            { id: 'bg-red',   hex: '#d3202a' },
            { id: 'bg-green', hex: '#00733e' }
        ];

        let currentLang = 'cs';
        let startingLife = 40;
        let playerCount = 4;
        let playersData = [];

        /* SETUP CONFIGURATION STATE */
        let activeSlotIndex = 0;
        let currentLayoutClass = 'players-4';
        let setupSlots = [];

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function selectLang(lang) {
            currentLang = lang;
            const t = translations[lang];
            document.getElementById('txt-select-life').innerText = t.selectLife;
            document.getElementById('txt-select-players').innerText = t.selectPlayers;
            document.getElementById('txt-select-colors').innerText = t.selectColors;
            document.getElementById('btn-start-game').innerText = t.start;
            document.getElementById('btn-menu').innerText = `⚙️ ${t.menu}`;
            document.getElementById('btn-roll-dice-trigger').innerText = t.rollDiceBtn;
            
            document.querySelectorAll('.txt-back').forEach(el => el.innerText = t.back);
            
            showScreen('screen-starting-life');
        }

        function selectStartingLife(life) {
            startingLife = life;
            document.getElementById('btn-reset').innerText = `↺ ${translations[currentLang].reset} (${startingLife})`;
            showScreen('screen-players');
        }

        function selectPlayerCount(count) {
            playerCount = count;
            activeSlotIndex = 0;
            setupSlots = [];

            if (playerCount === 2) currentLayoutClass = 'players-2';
            else if (playerCount === 3) currentLayoutClass = 'players-3-bottom-span';
            else currentLayoutClass = 'players-4';

            for (let i = 0; i < playerCount; i++) {
                setupSlots.push({
                    id: i,
                    colorClass: manaColors[i % manaColors.length].id
                });
            }

            updateSlotRotationsByPosition();
            startColorSetup();
        }

        function updateSlotRotationsByPosition() {
            setupSlots.forEach((slot, index) => {
                if (playerCount === 2) {
                    slot.rotated = (index === 0);
                } else if (playerCount === 4) {
                    slot.rotated = (index === 0 || index === 1);
                } else if (playerCount === 3) {
                    if (currentLayoutClass === 'players-3-bottom-span') {
                        slot.rotated = (index === 0 || index === 1);
                    } else if (currentLayoutClass === 'players-3-top-span') {
                        slot.rotated = (index === 0);
                    }
                }
            });
        }

        function startColorSetup() {
            showScreen('screen-colors');
            renderLayoutOptions();
            updateSetupUI();
        }

        function renderLayoutOptions() {
            const container = document.getElementById('layout-selector-container');
            container.innerHTML = '';

            if (playerCount === 3) {
                container.style.display = 'flex';
                const t = translations[currentLang];
                const layouts = [
                    { id: 'players-3-bottom-span', label: t.layout1Bot2Top },
                    { id: 'players-3-top-span', label: t.layout1Top2Bot }
                ];

                layouts.forEach(l => {
                    const btn = document.createElement('button');
                    btn.className = `opt-btn ${currentLayoutClass === l.id ? 'active' : ''}`;
                    btn.innerText = l.label;
                    btn.onclick = () => {
                        currentLayoutClass = l.id;
                        updateSlotRotationsByPosition();
                        renderLayoutOptions();
                        updateSetupUI();
                    };
                    container.appendChild(btn);
                });
            } else {
                container.style.display = 'none';
            }
        }

        /* 3D KOSTKY & SEKVENČNÍ HÁZENÍ */
        const diceOrientations = {
            1: { x: 0, y: 0 },
            2: { x: 0, y: 180 },
            3: { x: 0, y: 90 },
            4: { x: 0, y: -90 },
            5: { x: 90, y: 0 },
            6: { x: -90, y: 0 }
        };

        let diceParticipants = [];
        let diceQueue = [];
        let isTieBreak = false;

        function openDiceRollModal() {
            diceParticipants = setupSlots.map(s => ({
                id: s.id,
                roll: null
            }));
            diceParticipants.sort((a, b) => a.id - b.id);
            diceQueue = [...diceParticipants];
            isTieBreak = false;

            const modal = document.getElementById('dice-modal');
            modal.classList.add('show');
            updateDiceModalUI();
        }

        function executeCurrentRoll() {
            if (diceQueue.length === 0) {
                document.getElementById('dice-modal').classList.remove('show');
                return;
            }

            const currentPlayer = diceQueue[0];
            const bounceWrapper = document.getElementById('dice-bounce-wrapper');
            const cube1 = document.getElementById('cube1');
            const cube2 = document.getElementById('cube2');
            const resultText = document.getElementById('dice-result-text');
            const actionBtn = document.getElementById('dice-action-btn');

            bounceWrapper.classList.remove('animating');
            void bounceWrapper.offsetWidth; 
            bounceWrapper.classList.add('animating');

            const val1 = Math.floor(Math.random() * 6) + 1;
            const val2 = Math.floor(Math.random() * 6) + 1;
            const rollSum = val1 + val2;

            const extraRotX1 = (Math.floor(Math.random() * 3) + 4) * 360;
            const extraRotY1 = (Math.floor(Math.random() * 3) + 4) * 360;
            const extraRotX2 = (Math.floor(Math.random() * 3) + 4) * 360;
            const extraRotY2 = (Math.floor(Math.random() * 3) + 4) * 360;

            const target1 = diceOrientations[val1];
            const target2 = diceOrientations[val2];

            cube1.style.transform = `rotateX(${target1.x + extraRotX1}deg) rotateY(${target1.y + extraRotY1}deg)`;
            cube2.style.transform = `rotateX(${target2.x + extraRotX2}deg) rotateY(${target2.y + extraRotY2}deg)`;

            if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
            actionBtn.disabled = true;

            setTimeout(() => {
                currentPlayer.roll = rollSum;
                resultText.innerText = (currentLang === 'cs') ? `Hráč ${currentPlayer.id + 1} hodil: ${rollSum}` : `Player ${currentPlayer.id + 1} rolled: ${rollSum}`;
                
                diceQueue.shift();
                actionBtn.disabled = false;

                if (diceQueue.length > 0) {
                    updateDiceModalUI();
                } else {
                    evaluateDiceResults();
                }
            }, 1400);
        }

        function evaluateDiceResults() {
            let maxRoll = -1;
            diceParticipants.forEach(p => {
                if (p.roll !== null && p.roll > maxRoll) {
                    maxRoll = p.roll;
                }
            });

            const highestPlayers = diceParticipants.filter(p => p.roll === maxRoll);
            const resultText = document.getElementById('dice-result-text');
            const actionBtn = document.getElementById('dice-action-btn');

            if (highestPlayers.length === 1) {
                const winner = highestPlayers[0];
                if (currentLang === 'cs') {
                    resultText.innerHTML = `<span style="color: #4eff81;">Hráč ${winner.id + 1} vyhrál hod (${maxRoll}) a má právo výběru!</span>`;
                    actionBtn.innerText = "Zavřít";
                } else {
                    resultText.innerHTML = `<span style="color: #4eff81;">Player ${winner.id + 1} won the roll (${maxRoll}) and has choice!</span>`;
                    actionBtn.innerText = "Close";
                }
                actionBtn.onclick = () => {
                    document.getElementById('dice-modal').classList.remove('show');
                };
            } else {
                isTieBreak = true;
                diceQueue = highestPlayers.map(hp => {
                    hp.roll = null;
                    return hp;
                });

                if (currentLang === 'cs') {
                    resultText.innerHTML = `<span style="color: #ffcc00;">Shoda (${maxRoll}). Rozstřel pro: ${diceQueue.map(p => 'Hráč ' + (p.id + 1)).join(', ')}</span>`;
                    actionBtn.innerText = "Pokračovat v rozstřelu";
                } else {
                    resultText.innerHTML = `<span style="color: #ffcc00;">Tie (${maxRoll}). Re-roll for: ${diceQueue.map(p => 'Player ' + (p.id + 1)).join(', ')}</span>`;
                    actionBtn.innerText = "Continue Tie-Breaker";
                }
                actionBtn.onclick = executeCurrentRoll;
            }
        }

        function updateDiceModalUI() {
            const resultText = document.getElementById('dice-result-text');
            const actionBtn = document.getElementById('dice-action-btn');

            if (diceQueue.length > 0) {
                const nextPlayer = diceQueue[0];
                if (currentLang === 'cs') {
                    resultText.innerText = isTieBreak ? `Rozstřel – na řadě je Hráč ${nextPlayer.id + 1}` : `Na řadě je Hráč ${nextPlayer.id + 1}`;
                    actionBtn.innerText = `🎲 Hodit za Hráče ${nextPlayer.id + 1}`;
                } else {
                    resultText.innerText = isTieBreak ? `Tie-breaker – Player ${nextPlayer.id + 1}'s turn` : `Player ${nextPlayer.id + 1}'s turn`;
                    actionBtn.innerText = `🎲 Roll for Player ${nextPlayer.id + 1}`;
                }
                actionBtn.onclick = executeCurrentRoll;
            }
        }

        function closeDiceModal(e) {
            if (e.target.id === 'dice-modal') {
                document.getElementById('dice-modal').classList.remove('show');
            }
        }

        /* DRAG & DROP PRO PREVIEW SETUP */
        let setupDraggedIndex = null;

        function updateSetupUI() {
            const t = translations[currentLang];
            const currentSlotData = setupSlots[activeSlotIndex] || setupSlots[0];
            document.getElementById('txt-selected-slot-info').innerText = `${t.selectedSlot}: P${currentSlotData.id + 1}`;

            const preview = document.getElementById('table-preview');
            preview.className = `table-preview ${currentLayoutClass}`;
            preview.innerHTML = '';

            preview.onpointermove = handleSetupPointerMove;
            preview.onpointerup = handleSetupPointerUp;
            preview.onpointercancel = handleSetupPointerUp;

            setupSlots.forEach((slotData, index) => {
                const slot = document.createElement('div');
                slot.className = `slot ${slotData.colorClass} ${activeSlotIndex === index ? 'active-slot' : ''}`;
                slot.dataset.setupIndex = index;

                const label = document.createElement('span');
                if (slotData.rotated) label.className = 'slot-rotate';
                label.innerText = `P${slotData.id + 1}`;
                
                slot.appendChild(label);

                slot.onpointerdown = (e) => {
                    activeSlotIndex = index;
                    setupDraggedIndex = index;
                    slot.classList.add('dragging');
                    updateSetupUI();
                };

                preview.appendChild(slot);
            });

            const grid = document.getElementById('color-options');
            grid.innerHTML = '';

            manaColors.forEach(c => {
                const circle = document.createElement('div');
                circle.className = `color-btn ${c.id}`;
                if (setupSlots[activeSlotIndex].colorClass === c.id) {
                    circle.classList.add('selected');
                }
                circle.onclick = () => {
                    setupSlots[activeSlotIndex].colorClass = c.id;
                    updateSetupUI();
                };
                grid.appendChild(circle);
            });
        }

        function handleSetupPointerMove(e) {
            if (setupDraggedIndex === null) return;
            const elementUnder = document.elementFromPoint(e.clientX, e.clientY);
            if (!elementUnder) return;

            const targetSlot = elementUnder.closest('.slot');
            document.querySelectorAll('.slot').forEach(s => s.classList.remove('drag-over'));

            if (targetSlot && parseInt(targetSlot.dataset.setupIndex) !== setupDraggedIndex) {
                targetSlot.classList.add('drag-over');
            }
        }

        function handleSetupPointerUp(e) {
            if (setupDraggedIndex !== null) {
                const elementUnder = document.elementFromPoint(e.clientX, e.clientY);
                if (elementUnder) {
                    const targetSlot = elementUnder.closest('.slot');
                    if (targetSlot) {
                        const targetIndex = parseInt(targetSlot.dataset.setupIndex);
                        if (!isNaN(targetIndex) && targetIndex !== setupDraggedIndex) {
                            const temp = setupSlots[setupDraggedIndex];
                            setupSlots[setupDraggedIndex] = setupSlots[targetIndex];
                            setupSlots[targetIndex] = temp;
                            activeSlotIndex = targetIndex;
                        }
                    }
                }
            }
            setupDraggedIndex = null;
            document.querySelectorAll('.slot').forEach(s => s.classList.remove('dragging', 'drag-over'));
            
            updateSlotRotationsByPosition();
            updateSetupUI();
        }

        async function launchGame() {
            initPlayersData();

            try {
                if (document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                }
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                }
            } catch (e) {}

            await requestWakeLock();

            renderGame();
            showScreen('game-screen');
        }

        function initPlayersData() {
            playersData = [];
            setupSlots.forEach((slot, i) => {
                playersData.push({
                    id: slot.id,
                    life: startingLife,
                    colorClass: slot.colorClass,
                    rotated: slot.rotated,
                    currentDelta: 0,
                    deltaTimer: null,
                    cmdDamage: {}
                });
            });

            playersData.forEach(p => {
                playersData.forEach(op => {
                    if (op.id !== p.id) {
                        p.cmdDamage[op.id] = 0;
                    }
                });
            });
        }

        function exitToMenu() {
            document.getElementById('dropdown-menu').classList.remove('show');
            if (document.exitFullscreen && document.fullscreenElement) {
                document.exitFullscreen().catch(() => {});
            }
            if (screen.orientation && screen.orientation.unlock) {
                screen.orientation.unlock();
            }
            releaseWakeLock();
            showScreen('screen-lang');
        }

        function resetGame() {
            document.getElementById('dropdown-menu').classList.remove('show');
            initPlayersData();
            renderGame();
        }

        function changeLife(index, amount) {
            const player = playersData[index];
            player.life += amount;
            player.currentDelta += amount;

            const lifeEl = document.getElementById(`life-val-${index}`);
            if (lifeEl) lifeEl.innerText = player.life;

            const badgeEl = document.getElementById(`life-badge-${index}`);
            if (badgeEl) {
                clearTimeout(player.deltaTimer);

                const prefix = player.currentDelta > 0 ? '+' : '';
                badgeEl.innerText = `${prefix}${player.currentDelta}`;
                badgeEl.className = 'life-change-badge show ' + (player.currentDelta > 0 ? 'plus' : 'minus');

                player.deltaTimer = setTimeout(() => {
                    badgeEl.classList.remove('show');
                    setTimeout(() => { player.currentDelta = 0; }, 200);
                }, 2100);
            }
        }

        /* COMMANDER DAMAGE LOGIKA & NOTIFIKACE */
        let activeCmdPlayerIndex = null;
        let notificationTimeout = null;

        function showGameNotification(message) {
            const notif = document.getElementById('game-notification');
            if (!notif) return;
            notif.innerText = message;
            notif.classList.add('show');

            clearTimeout(notificationTimeout);
            notificationTimeout = setTimeout(() => {
                notif.classList.remove('show');
            }, 4500);
        }

        function openCmdModal(index) {
            activeCmdPlayerIndex = index;
            const player = playersData[index];
            const modal = document.getElementById('cmd-modal');
            const modalBox = document.getElementById('cmd-modal-box');
            const title = document.getElementById('cmd-modal-title');
            const list = document.getElementById('cmd-list');

            // Automatické otočení celé tabulky podle toho, zda je hráč otočený (např. nahoře)
            if (player.rotated) {
                modalBox.classList.add('rotated');
            } else {
                modalBox.classList.remove('rotated');
            }

            title.innerText = `Commander Damage – P${player.id + 1}`;
            list.innerHTML = '';

            playersData.forEach((opponent, opIndex) => {
                if (opponent.id === player.id) return;

                const currentDmg = player.cmdDamage[opponent.id] || 0;

                const row = document.createElement('div');
                row.style.cssText = "display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 10px 14px; border-radius: 10px;";
                
                row.innerHTML = `
                    <div style="font-weight: bold; display: flex; align-items: center; gap: 8px;">
                        <span style="display: inline-block; width: 12px; height: 12px; border-radius: 50%;" class="${opponent.colorClass}"></span>
                        P${opponent.id + 1}
                    </div>
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <button class="sub-btn" style="padding: 6px 14px;" onclick="adjustCmdDamage(${index}, ${opponent.id}, -1)">-</button>
                        <span style="font-size: 1.2rem; font-weight: bold; min-width: 25px; text-align: center;">${currentDmg}</span>
                        <button class="sub-btn" style="padding: 6px 14px;" onclick="adjustCmdDamage(${index}, ${opponent.id}, 1)">+</button>
                    </div>
                `;
                list.appendChild(row);
            });

            modal.classList.add('show');
        }

        function adjustCmdDamage(playerIndex, opponentId, amount) {
            const player = playersData[playerIndex];
            if (player.cmdDamage[opponentId] === undefined) {
                player.cmdDamage[opponentId] = 0;
            }
            player.cmdDamage[opponentId] = Math.max(0, player.cmdDamage[opponentId] + amount);
            
            if (player.cmdDamage[opponentId] >= 21) {
                player.life = 0;
                const msg = (currentLang === 'cs') ? `Hráč ${player.id + 1} prohrál` : `Player ${player.id + 1} has lost`;
                showGameNotification(msg);
            }

            const lifeEl = document.getElementById(`life-val-${playerIndex}`);
            if (lifeEl) {
                lifeEl.innerText = player.life;
            }

            openCmdModal(playerIndex);
        }

        function closeCmdModal(e) {
            if (e.target.id === 'cmd-modal') {
                document.getElementById('cmd-modal').classList.remove('show');
            }
        }

        function closeCmdModalForce() {
            document.getElementById('cmd-modal').classList.remove('show');
        }

        /* IN-GAME DRAG & DROP LOGIKA */
        let draggedIndex = null;
        let dragTimer = null;
        let isDragging = false;

        function handlePointerDown(e, index) {
            if (e.target.closest('.touch-zone') || e.target.closest('.cmd-btn')) return;

            draggedIndex = index;
            const targetCard = e.currentTarget;

            dragTimer = setTimeout(() => {
                isDragging = true;
                targetCard.classList.add('dragging');
                if (navigator.vibrate) navigator.vibrate(50);
            }, 400);
        }

        function handlePointerMove(e) {
            if (!isDragging || draggedIndex === null) return;
            const elementUnder = document.elementFromPoint(e.clientX, e.clientY);
            if (!elementUnder) return;

            const targetCard = elementUnder.closest('.player-card');
            document.querySelectorAll('.player-card').forEach(card => card.classList.remove('drag-over'));

            if (targetCard && parseInt(targetCard.dataset.index) !== draggedIndex) {
                targetCard.classList.add('drag-over');
            }
        }

        function handlePointerUp(e) {
            clearTimeout(dragTimer);

            if (isDragging && draggedIndex !== null) {
                const elementUnder = document.elementFromPoint(e.clientX, e.clientY);
                if (elementUnder) {
                    const targetCard = elementUnder.closest('.player-card');
                    if (targetCard) {
                        const targetIndex = parseInt(targetCard.dataset.index);
                        if (!isNaN(targetIndex) && targetIndex !== draggedIndex) {
                            const temp = playersData[draggedIndex];
                            playersData[draggedIndex] = playersData[targetIndex];
                            playersData[targetIndex] = temp;
                        }
                    }
                }
                isDragging = false;
                draggedIndex = null;
                document.querySelectorAll('.player-card').forEach(card => {
                    card.classList.remove('dragging', 'drag-over');
                });
                renderGame();
            } else {
                isDragging = false;
                draggedIndex = null;
                document.querySelectorAll('.player-card').forEach(card => {
                    card.classList.remove('dragging', 'drag-over');
                });
            }
        }

        function renderGame() {
            const grid = document.getElementById('grid');
            grid.className = currentLayoutClass;
            grid.innerHTML = '';

            grid.onpointermove = handlePointerMove;
            grid.onpointerup = handlePointerUp;
            grid.onpointercancel = handlePointerUp;

            playersData.forEach((player, index) => {
                const card = document.createElement('div');
                card.className = `player-card ${player.colorClass}`;
                card.dataset.index = index;

                card.onpointerdown = (e) => handlePointerDown(e, index);

                const leftSymbol = player.rotated ? '+' : '−';
                const leftAmount = player.rotated ? 1 : -1;
                const rightSymbol = player.rotated ? '−' : '+';
                const rightAmount = player.rotated ? -1 : 1;

                let cmdButtonHtml = '';
                if (startingLife === 40) {
                    cmdButtonHtml = `<button class="cmd-btn" onpointerdown="event.stopPropagation();" onclick="event.stopPropagation(); openCmdModal(${index})">⚔️ CMD</button>`;
                }

                card.innerHTML = `
                    <div class="touch-zone touch-left" onpointerdown="event.stopPropagation(); changeLife(${index}, ${leftAmount})">${leftSymbol}</div>
                    <div class="touch-zone touch-right" onpointerdown="event.stopPropagation(); changeLife(${index}, ${rightAmount})">${rightSymbol}</div>
                    <div class="player-content ${player.rotated ? 'rotate-content' : ''}">
                        ${cmdButtonHtml}
                        <div class="player-label">P${player.id + 1}</div>
                        <div class="life-total" id="life-val-${index}">${player.life}</div>
                        <div class="life-change-badge" id="life-badge-${index}"></div>
                    </div>
                `;

                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
